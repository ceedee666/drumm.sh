{{ define "main" }}
<h1>{{ .Title }}</h1>
<div class="row mb-5">
  <div class="col blog-date-time">
    {{ partial "published-meta.html" . }}
  </div>
</div>
<div class="blog-body">
  {{ .Content }}
</div>
<div class="mt-5">
  <div class="row">
    <div class="col">
      {{ partial "comments.html" . }}
    </div>
  </div>
</div>
{{ end }}
