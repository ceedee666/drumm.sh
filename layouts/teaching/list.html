{{ define "main" }}
{{ $page := . }}
{{ with .Params.title }}
<h1>{{ . }}</h1>
<div class="row mb-5">
  <div class="col blog-date-time">
    {{ partial "icon.html" "calendar" }} Last updated: {{ partial "relative-date.html" $page.Lastmod }} ({{ $page.Lastmod.Format "02. January 2006" }})
  </div>
</div>
{{ end }}
<div class="blog-body">{{ .Content }}</div>
{{ end }}
