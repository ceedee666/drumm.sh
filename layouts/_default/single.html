{{ define "main" }}
<h1>{{ .Title }}</h1>
<div class="row mb-5">
  <div class="col blog-date-time">
    {{ partial "icon.html" "calendar" }} Last updated: {{ partial "relative-date.html" .Lastmod }} ({{ .Lastmod.Format "02. January 2006" }})
  </div>
</div>
<div class="blog-body">
  {{ .Content }}
</div>
{{ end }}
