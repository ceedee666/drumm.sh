[build]
  command = "hugo --minify --cleanDestinationDir"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.166.0"
  HUGO_ENV = "production"

[[headers]]
  for = "/is-slides-st-26/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "frame-ancestors 'self';"
